<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="樱花迷宫 logo（纯色版）">
  <!--
    樱花迷宫 · 个人页面 logo（纯色版 / Mono）
    - 全图形以单一品牌色 #FF5FA2（樱花粉）填充，去奶油白底与墨棕粗边
    - 花心保留白色镂空圆，迷宫方形螺旋以品牌色描边，单色下仍可辨「迷宫」
    - 透明背景，任意底色皆可放置；矢量无损缩放
    深色背景使用：将全部 #FF5FA2 替换为 #FFFFFF 即得反色版。
    favicon（≤32px）：删除 <path class="maze"> 一行，花心改 fill="#FF5FA2" 实心即可。
  -->

  <defs>
    <!-- 单瓣樱花：基部在 (0,0)，尖端在 (0,-62) -->
    <path id="petal-mono" d="M0 0 C -22 -8 -22 -52 0 -62 C 22 -52 22 -8 0 0 Z"/>
  </defs>

  <!-- 樱花 5 瓣：单色填充（同色描边仅用于缩放时弥合接缝） -->
  <g fill="#FF5FA2" stroke="#FF5FA2" stroke-width="2" stroke-linejoin="round">
    <use href="#petal-mono" transform="translate(100,100) rotate(0)"/>
    <use href="#petal-mono" transform="translate(100,100) rotate(72)"/>
    <use href="#petal-mono" transform="translate(100,100) rotate(144)"/>
    <use href="#petal-mono" transform="translate(100,100) rotate(216)"/>
    <use href="#petal-mono" transform="translate(100,100) rotate(288)"/>
  </g>

  <!-- 花心：白色镂空圆（让迷宫螺旋在单色下可见） -->
  <circle cx="100" cy="100" r="24" fill="#FFFFFF"/>

  <!-- 花心迷宫：方形螺旋（品牌色描边，局部坐标以中心为原点） -->
  <path class="maze"
        d="M -11 -11 H 11 V 11 H -8 V -8 H 8 V 8 H -5 V -5 H 5 V 5 H -2 V -2 H 2 V 2 H -1 V -1 H 1"
        transform="translate(100,100)"
        fill="none" stroke="#FF5FA2" stroke-width="3" stroke-linecap="square"/>
</svg>
