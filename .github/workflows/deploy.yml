name: Deploy to GitHub Pages

on:
  push:
    branches: [ "main" ]  # 当 main 分支有推送时触发

permissions:
  contents: write # 允许 Actions 推送代码到 gh-pages 分支

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      # 这里替换为你自己项目的构建步骤
      # 例如 Node.js 项目：
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci
      - run: npm run build # 构建命令，生成 ./dist 文件夹

      # 部署到 gh-pages 分支
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # 指定要部署的文件夹，根据你的项目修改